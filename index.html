<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVIESTREAMING - Premium Movie Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090c15',
                        cardBg: '#111623',
                        accentRed: '#ff1e42',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0d111a;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        /* Fully Responsive 3D Cover-Flow Carousel */
        .carousel-container {
            perspective: 1400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 480px;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
        }
        .carousel-card {
            position: absolute;
            width: 250px;
            height: 375px;
            border-radius: 16px;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            overflow: hidden;
            background: #111623;
        }
        .carousel-card.active {
            transform: translateZ(150px) scale(1.12);
            z-index: 30;
            border: 2px solid rgba(255, 30, 66, 0.8);
            box-shadow: 0 30px 70px rgba(255, 30, 66, 0.45);
        }
        .carousel-card.left-1 {
            transform: translateX(-280px) translateZ(-20px) scale(0.9) rotateY(15deg);
            z-index: 20;
            opacity: 0.85;
        }
        .carousel-card.right-1 {
            transform: translateX(280px) translateZ(-20px) scale(0.9) rotateY(-15deg);
            z-index: 20;
            opacity: 0.85;
        }
        .carousel-card.left-2 {
            transform: translateX(-520px) translateZ(-90px) scale(0.72) rotateY(28deg);
            z-index: 10;
            opacity: 0.5;
        }
        .carousel-card.right-2 {
            transform: translateX(520px) translateZ(-90px) scale(0.72) rotateY(-28deg);
            z-index: 10;
            opacity: 0.5;
        }
        .carousel-card.hidden-card {
            opacity: 0;
            transform: scale(0.4);
            z-index: 0;
            pointer-events: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #090c15; }
        ::-webkit-scrollbar-thumb { background: #ff1e42; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

    <!-- Header Navigation -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-[#090c15]/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <a href="#" class="text-xl font-black tracking-wider text-accentRed flex items-center gap-2">
                    <i class="fa-solid fa-play-circle text-2xl"></i> MOVIESTREAMING
                </a>
                <nav class="hidden lg:flex items-center space-x-2 text-sm font-medium text-gray-300">
                    <a href="#" class="bg-accentRed text-white px-4 py-1.5 rounded-full font-semibold">Home</a>
                    <a href="#trending" class="hover:text-white px-3 py-1.5 transition">Trending</a>
                    <a href="#action" class="hover:text-white px-3 py-1.5 transition">Action</a>
                    <a href="#animation" class="hover:text-white px-3 py-1.5 transition">Animation</a>
                    <a href="#" class="hover:text-white px-3 py-1.5 transition">My List</a>
                </nav>
            </div>

            <!-- Instant Search -->
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="bg-black/60 border border-white/10 rounded-full flex items-center px-4 py-2 focus-within:border-accentRed transition w-44 sm:w-60">
                        <i class="fa-solid fa-search text-gray-400 text-xs mr-2"></i>
                        <input type="text" id="searchInput" autocomplete="off" placeholder="Search live titles..." class="bg-transparent text-xs text-white focus:outline-none w-full">
                        <i id="searchSpinner" class="fa-solid fa-spinner fa-spin text-accentRed text-xs hidden"></i>
                    </div>
                    <div id="searchResultsDropdown" class="absolute right-0 top-12 w-80 sm:w-96 bg-[#111623] border border-white/10 rounded-2xl shadow-2xl overflow-hidden z-50 hidden max-h-96 overflow-y-auto divide-y divide-white/5"></div>
                </div>
                <button class="bg-accentRed hover:bg-red-600 text-white px-5 py-2 rounded-full text-xs font-bold transition shadow-lg shadow-red-600/30">
                    Sign In
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow pt-24 pb-16 space-y-12">
        
        <!-- Hero Section with Dynamic Full-Width Backdrop Blur & 3D Carousel -->
        <section class="relative w-full py-8 overflow-hidden bg-cover bg-center" id="heroSection" style="background-image: linear-gradient(to bottom, rgba(9,12,21,0.85), rgba(9,12,21,0.98)), url('https://image.tmdb.org/t/p/original/rSPw7gzTheWDUL6uRWffnWrlnXh.jpg');">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
                <div class="carousel-container" id="carouselContainer"></div>

                <!-- Carousel Controls -->
                <button id="prevBtn" class="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 z-40 w-11 h-11 rounded-full bg-black/70 hover:bg-accentRed text-white flex items-center justify-center transition border border-white/10 shadow-lg">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button id="nextBtn" class="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 z-40 w-11 h-11 rounded-full bg-black/70 hover:bg-accentRed text-white flex items-center justify-center transition border border-white/10 shadow-lg">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

                <!-- Dots -->
                <div class="flex justify-center gap-2 mt-6" id="dotsContainer"></div>
            </div>
        </section>

        <!-- Movie Grid Sections -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
            <!-- Section 1: Trending Now -->
            <section id="trending">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold border-l-4 border-accentRed pl-3">Trending Movies</h2>
                    <span class="text-xs text-gray-400 hover:text-white cursor-pointer">View All</span>
                </div>
                <div id="trendingGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5"></div>
            </section>

            <!-- Section 2: Action Blockbusters -->
            <section id="action">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold border-l-4 border-accentRed pl-3">Action Blockbusters</h2>
                    <span class="text-xs text-gray-400 hover:text-white cursor-pointer">View All</span>
                </div>
                <div id="actionGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5"></div>
            </section>

            <!-- Section 3: Animation & Family -->
            <section id="animation">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold border-l-4 border-accentRed pl-3">Animation & Family</h2>
                    <span class="text-xs text-gray-400 hover:text-white cursor-pointer">View All</span>
                </div>
                <div id="animationGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5"></div>
            </section>
        </div>

    </main>

    <!-- Multi-Server Video Streaming Modal -->
    <div id="streamModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden items-center justify-center p-2 sm:p-4">
        <div class="relative w-full max-w-5xl aspect-video bg-[#090c15] rounded-2xl overflow-hidden shadow-2xl border border-white/10 flex flex-col">
            <div class="flex flex-wrap items-center justify-between px-4 sm:px-6 py-3 bg-[#111623] border-b border-white/10 gap-2">
                <h3 id="modalMovieTitle" class="text-sm font-bold text-white truncate max-w-xs sm:max-w-md">Streaming Player</h3>
                <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-[10px] text-gray-400 uppercase font-semibold mr-1">Servers:</span>
                    <button onclick="switchServer(1)" id="srv1" class="srv-btn bg-accentRed text-white px-2.5 py-1 rounded-md text-[11px] font-bold">Server 1</button>
                    <button onclick="switchServer(2)" id="srv2" class="srv-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-2.5 py-1 rounded-md text-[11px] font-bold">Server 2</button>
                    <button onclick="switchServer(3)" id="srv3" class="srv-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-2.5 py-1 rounded-md text-[11px] font-bold">Server 3</button>
                    <button onclick="switchServer(4)" id="srv4" class="srv-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-2.5 py-1 rounded-md text-[11px] font-bold">Server 4</button>
                    <button onclick="switchServer(5)" id="srv5" class="srv-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-2.5 py-1 rounded-md text-[11px] font-bold">Server 5</button>
                    <button id="closeModal" class="ml-3 text-gray-400 hover:text-white text-lg">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div class="relative flex-grow bg-black">
                <iframe id="videoPlayer" class="w-full h-full border-0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const API_KEY = '66721a9123406bc438cf6cd6d90d5e18';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/original';

        let trendingList = [];
        let currentIndex = 0;
        let currentMovieId = null;

        const carouselContainer = document.getElementById('carouselContainer');
        const dotsContainer = document.getElementById('dotsContainer');
        const heroSection = document.getElementById('heroSection');
        const trendingGrid = document.getElementById('trendingGrid');
        const actionGrid = document.getElementById('actionGrid');
        const animationGrid = document.getElementById('animationGrid');
        const streamModal = document.getElementById('streamModal');
        const videoPlayer = document.getElementById('videoPlayer');
        const modalMovieTitle = document.getElementById('modalMovieTitle');
        const searchInput = document.getElementById('searchInput');
        const searchSpinner = document.getElementById('searchSpinner');
        const searchResultsDropdown = document.getElementById('searchResultsDropdown');

        async function initApp() {
            try {
                // Fetch Trending Movies
                const trendingRes = await fetch(`${BASE_URL}/trending/movie/day?api_key=${API_KEY}`);
                const trendingData = await trendingRes.json();
                if(trendingData.results) {
                    trendingList = trendingData.results;
                    renderCarousel();
                    renderGrid(trendingList, trendingGrid);
                }

                // Fetch Action Movies (Genre ID: 28)
                const actionRes = await fetch(`${BASE_URL}/discover/movie?api_key=${API_KEY}&with_genres=28`);
                const actionData = await actionRes.json();
                if(actionData.results) renderGrid(actionData.results, actionGrid);

                // Fetch Animation Movies (Genre ID: 16)
                const animRes = await fetch(`${BASE_URL}/discover/movie?api_key=${API_KEY}&with_genres=16`);
                const animData = await animRes.json();
                if(animData.results) renderGrid(animData.results, animationGrid);

            } catch (err) {
                console.error("API Fetch Error", err);
            }
        }

        function renderCarousel() {
            carouselContainer.innerHTML = '';
            dotsContainer.innerHTML = '';
            const featured = trendingList.slice(0, 5);

            featured.forEach((movie, idx) => {
                const card = document.createElement('div');
                card.className = `carousel-card hidden-card`;
                card.innerHTML = `
                    <img src="${IMG_URL + movie.poster_path}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent p-5 flex flex-col justify-end">
                        <h3 class="text-sm font-extrabold text-white mb-1 uppercase tracking-wide truncate">${movie.title || movie.name}</h3>
                        <div class="flex items-center gap-2 text-xs mb-3 text-gray-300">
                            <span class="text-yellow-400 font-bold"><i class="fa-solid fa-star"></i> ${movie.vote_average.toFixed(1)}</span>
                            <span>${movie.release_date ? movie.release_date.split('-')[0] : '2026'}</span>
                            <span class="bg-accentRed text-white px-1.5 py-0.5 rounded text-[9px] font-bold">HD</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="openStream(${movie.id}, '${(movie.title || movie.name).replace(/'/g, "\\'")}')" class="flex-1 bg-accentRed hover:bg-red-600 text-white font-bold py-2 rounded-xl flex items-center justify-center gap-1 shadow-lg shadow-red-600/40 text-xs transition">
                                <i class="fa-solid fa-play"></i> Play Live
                            </button>
                            <button class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-xs font-bold transition">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                `;
                carouselContainer.appendChild(card);

                const dot = document.createElement('div');
                dot.className = `h-1.5 rounded-full transition-all duration-300 ${idx === currentIndex ? 'w-6 bg-accentRed' : 'w-2 bg-gray-600'}`;
                dotsContainer.appendChild(dot);
            });

            updateCarouselPositions();
        }

        function updateCarouselPositions() {
            const cards = document.querySelectorAll('.carousel-card');
            const dots = dotsContainer.children;
            const total = cards.length;

            cards.forEach((card, idx) => {
                card.className = 'carousel-card hidden-card';
                if (idx === currentIndex) {
                    card.className = 'carousel-card active';
                    // Update Hero Background Banner dynamically based on active slide
                    if(trendingList[idx] && trendingList[idx].backdrop_path) {
                        heroSection.style.backgroundImage = `linear-gradient(to bottom, rgba(9,12,21,0.8), rgba(9,12,21,0.98)), url('${BACKDROP_URL + trendingList[idx].backdrop_path}')`;
                    }
                } else if (idx === (currentIndex - 1 + total) % total) {
                    card.className = 'carousel-card left-1';
                } else if (idx === (currentIndex + 1) % total) {
                    card.className = 'carousel-card right-1';
                } else if (idx === (currentIndex - 2 + total) % total) {
                    card.className = 'carousel-card left-2';
                } else if (idx === (currentIndex + 2) % total) {
                    card.className = 'carousel-card right-2';
                }
            });

            Array.from(dots).forEach((dot, idx) => {
                dot.className = `h-1.5 rounded-full transition-all duration-300 ${idx === currentIndex ? 'w-6 bg-accentRed' : 'w-2 bg-gray-600'}`;
            });
        }

        document.getElementById('prevBtn').onclick = () => {
            currentIndex = (currentIndex - 1 + 5) % 5;
            updateCarouselPositions();
        };

        document.getElementById('nextBtn').onclick = () => {
            currentIndex = (currentIndex + 1) % 5;
            updateCarouselPositions();
        };

        function renderGrid(movies, container) {
            container.innerHTML = '';
            movies.forEach(movie => {
                if(!movie.poster_path) return;
                const card = document.createElement('div');
                card.className = 'bg-cardBg rounded-xl overflow-hidden border border-white/5 hover:border-accentRed/50 transition duration-300 cursor-pointer group shadow-lg';
                card.innerHTML = `
                    <div class="aspect-[2/3] relative overflow-hidden bg-gray-900">
                        <img src="${IMG_URL + movie.poster_path}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <div class="absolute top-2 right-2 bg-black/70 backdrop-blur-md px-2 py-0.5 rounded text-[10px] font-bold text-yellow-400">
                            <i class="fa-solid fa-star"></i> ${movie.vote_average.toFixed(1)}
                        </div>
                    </div>
                    <div class="p-3">
                        <h4 class="text-xs font-bold text-white truncate">${movie.title || movie.name}</h4>
                        <p class="text-[10px] text-gray-400 mt-0.5">${movie.release_date ? movie.release_date.split('-')[0] : 'N/A'}</p>
                    </div>
                `;
                card.onclick = () => openStream(movie.id, movie.title || movie.name);
                container.appendChild(card);
            });
        }

        // Search Handler
        let searchDebounce;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchDebounce);
            const query = e.target.value.trim();

            if (query.length < 2) {
                searchResultsDropdown.classList.add('hidden');
                searchResultsDropdown.innerHTML = '';
                searchSpinner.classList.add('hidden');
                return;
            }

            searchSpinner.classList.remove('hidden');

            searchDebounce = setTimeout(async () => {
                try {
                    const res = await fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    searchSpinner.classList.add('hidden');

                    if (data.results && data.results.length > 0) {
                        searchResultsDropdown.innerHTML = '';
                        data.results.slice(0, 6).forEach(movie => {
                            const item = document.createElement('div');
                            item.className = 'flex items-center gap-3 p-2.5 hover:bg-white/10 cursor-pointer transition';
                            const poster = movie.poster_path ? (IMG_URL + movie.poster_path) : 'https://via.placeholder.com/50x75';
                            item.innerHTML = `
                                <img src="${poster}" class="w-10 h-14 object-cover rounded">
                                <div class="overflow-hidden">
                                    <h5 class="text-xs font-bold text-white truncate">${movie.title || movie.name}</h5>
                                    <p class="text-[10px] text-gray-400 mt-0.5"><i class="fa-solid fa-star text-yellow-400"></i> ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'} • ${movie.release_date ? movie.release_date.split('-')[0] : ''}</p>
                                </div>
                            `;
                            item.onclick = () => {
                                openStream(movie.id, movie.title || movie.name);
                                searchResultsDropdown.classList.add('hidden');
                                searchInput.value = '';
                            };
                            searchResultsDropdown.appendChild(item);
                        });
                        searchResultsDropdown.classList.remove('hidden');
                    } else {
                        searchResultsDropdown.innerHTML = `<div class="p-4 text-xs text-center text-gray-400">No movies found</div>`;
                        searchResultsDropdown.classList.remove('hidden');
                    }
                } catch (err) {
                    searchSpinner.classList.add('hidden');
                }
            }, 300);
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResultsDropdown.contains(e.target)) {
                searchResultsDropdown.classList.add('hidden');
            }
        });

        // 5 Multi-Streaming Servers Switcher
        function openStream(movieId, title) {
            currentMovieId = movieId;
            modalMovieTitle.textContent = title;
            switchServer(1);
            streamModal.classList.remove('hidden');
            streamModal.classList.add('flex');
        }

        function switchServer(serverNum) {
            document.querySelectorAll('.srv-btn').forEach(btn => {
                btn.className = 'srv-btn bg-gray-800 text-gray-300 hover:bg-gray-700 px-2.5 py-1 rounded-md text-[11px] font-bold';
            });
            document.getElementById(`srv${serverNum}`).className = 'srv-btn bg-accentRed text-white px-2.5 py-1 rounded-md text-[11px] font-bold shadow';

            if (serverNum === 1) {
                videoPlayer.src = `https://vidsrc.to/embed/movie/${currentMovieId}`;
            } else if (serverNum === 2) {
                videoPlayer.src = `https://vidsrc.cc/v2/embed/movie/${currentMovieId}`;
            } else if (serverNum === 3) {
                videoPlayer.src = `https://embed.su/embed/movie/${currentMovieId}`;
            } else if (serverNum === 4) {
                videoPlayer.src = `https://multiembed.mov/directstream.php?video_id=${currentMovieId}&tmdb=1`;
            } else if (serverNum === 5) {
                videoPlayer.src = `https://www.2embed.cc/embed/${currentMovieId}`;
            }
        }

        document.getElementById('closeModal').onclick = () => {
            videoPlayer.src = '';
            streamModal.classList.remove('flex');
            streamModal.classList.add('hidden');
        };

        initApp();
    </script>
</body>
</html>
