<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moviestreaming - Watch Movies & TV Shows Live</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090c15',
                        cardBg: '#111623',
                        accentRed: '#ff1e42',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #090c15;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        /* 3D Carousel Styles */
        .carousel-container {
            perspective: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 480px;
        }
        .carousel-card {
            position: absolute;
            width: 280px;
            height: 420px;
            border-radius: 20px;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .carousel-card.active {
            transform: translateZ(100px) scale(1.1);
            z-index: 30;
            border: 2px solid rgba(255, 30, 66, 0.5);
            box-shadow: 0 25px 50px rgba(255, 30, 66, 0.25);
        }
        .carousel-card.left-1 {
            transform: translateX(-240px) translateZ(0px) scale(0.9) rotateY(15deg);
            z-index: 20;
            opacity: 0.75;
        }
        .carousel-card.right-1 {
            transform: translateX(240px) translateZ(0px) scale(0.9) rotateY(-15deg);
            z-index: 20;
            opacity: 0.75;
        }
        .carousel-card.hidden-card {
            opacity: 0;
            transform: scale(0.5);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

    <!-- Header Navigation Bar -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-[#090c15]/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <!-- Logo & Nav Links -->
            <div class="flex items-center space-x-6">
                <a href="#" class="text-xl font-black tracking-wider text-accentRed flex items-center gap-2">
                    <i class="fa-solid fa-play-circle text-2xl"></i> MOVIESTREAMING
                </a>
                <nav class="hidden lg:flex items-center space-x-2 text-sm font-medium text-gray-300">
                    <a href="#" class="bg-accentRed text-white px-4 py-1.5 rounded-full font-semibold">Home</a>
                    <a href="#trending" class="hover:text-white px-3 py-1.5 transition">Trending</a>
                    <a href="#movies" class="hover:text-white px-3 py-1.5 transition">Movies</a>
                    <a href="#series" class="hover:text-white px-3 py-1.5 transition">TV Series</a>
                    <a href="#" class="hover:text-white px-3 py-1.5 transition">My List</a>
                    <a href="#" class="hover:text-white px-3 py-1.5 transition">More <i class="fa-solid fa-chevron-down text-xs ml-1"></i></a>
                </nav>
            </div>

            <!-- Search & Actions -->
            <div class="flex items-center space-x-3">
                <div class="relative flex items-center">
                    <div class="bg-black/50 border border-white/10 rounded-full flex items-center px-3 py-1.5 focus-within:border-accentRed transition">
                        <i class="fa-solid fa-search text-gray-400 text-xs mr-2"></i>
                        <input type="text" id="searchInput" placeholder="Search live titles..." class="bg-transparent text-xs text-white focus:outline-none w-36 sm:w-48">
                    </div>
                </div>
                <button class="bg-white/5 hover:bg-white/10 text-gray-300 p-2 rounded-full transition text-xs">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <button class="bg-accentRed hover:bg-red-600 text-white px-5 py-2 rounded-full text-xs font-bold transition shadow-lg shadow-red-600/30">
                    Sign In
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow pt-24 pb-12">
        
        <!-- 3D Hero Carousel Section -->
        <section class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 overflow-hidden">
            <div class="carousel-container" id="carouselContainer">
                <!-- Cards injected dynamically via JS -->
            </div>

            <!-- Carousel Nav Controls -->
            <button id="prevBtn" class="absolute left-4 top-1/2 -translate-y-1/2 z-40 w-10 h-10 rounded-full bg-black/60 hover:bg-accentRed text-white flex items-center justify-center transition border border-white/10">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button id="nextBtn" class="absolute right-4 top-1/2 -translate-y-1/2 z-40 w-10 h-10 rounded-full bg-black/60 hover:bg-accentRed text-white flex items-center justify-center transition border border-white/10">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <!-- Dots Indicator -->
            <div class="flex justify-center gap-2 mt-6" id="dotsContainer"></div>
        </section>

        <!-- Dynamic Trending Section -->
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6" id="trending">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold border-l-4 border-accentRed pl-3 flex items-center gap-2">
                    Trending Movies
                </h2>
                <span class="text-xs text-gray-400 hover:text-white cursor-pointer">View All</span>
            </div>
            <div id="trendingGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <!-- Dynamic cards load here -->
            </div>
        </section>

    </main>

    <!-- Video Streaming Modal -->
    <div id="streamModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="relative w-full max-w-5xl aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-white/10 flex flex-col">
            <div class="flex items-center justify-between px-6 py-3 bg-[#111623] border-b border-white/10">
                <h3 id="modalMovieTitle" class="text-sm font-bold text-white truncate">Streaming Player</h3>
                <div class="flex items-center gap-2">
                    <button id="server1Btn" onclick="switchServer(1)" class="bg-accentRed text-white px-3 py-1 rounded text-xs font-semibold">Server 1</button>
                    <button id="server2Btn" onclick="switchServer(2)" class="bg-gray-800 text-gray-300 hover:bg-gray-700 px-3 py-1 rounded text-xs font-semibold">Server 2</button>
                    <button id="closeModal" class="ml-4 text-gray-400 hover:text-white text-lg">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div class="relative flex-grow">
                <iframe id="videoPlayer" class="w-full h-full border-0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- JS Functionality -->
    <script>
        const API_KEY = '66721a9123406bc438cf6cd6d90d5e18';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        let moviesList = [];
        let currentIndex = 0;
        let currentMovieId = null;

        const carouselContainer = document.getElementById('carouselContainer');
        const dotsContainer = document.getElementById('dotsContainer');
        const trendingGrid = document.getElementById('trendingGrid');
        const streamModal = document.getElementById('streamModal');
        const videoPlayer = document.getElementById('videoPlayer');
        const modalMovieTitle = document.getElementById('modalMovieTitle');
        const searchInput = document.getElementById('searchInput');

        async function initApp() {
            try {
                const res = await fetch(`${BASE_URL}/trending/movie/day?api_key=${API_KEY}`);
                const data = await res.json();
                if(data.results && data.results.length > 0) {
                    moviesList = data.results;
                    renderCarousel();
                    renderGrid(moviesList);
                }
            } catch (err) {
                console.error("Failed to fetch TMDB data", err);
            }
        }

        function renderCarousel() {
            carouselContainer.innerHTML = '';
            dotsContainer.innerHTML = '';

            const featuredMovies = moviesList.slice(0, 5);

            featuredMovies.forEach((movie, idx) => {
                const card = document.createElement('div');
                card.className = `carousel-card hidden-card`;
                card.innerHTML = `
                    <img src="${IMG_URL + movie.poster_path}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent p-5 flex flex-col justify-end text-center">
                        <h3 class="text-xl font-extrabold text-white mb-2 uppercase tracking-wide">${movie.title || movie.name}</h3>
                        <div class="flex items-center justify-center gap-2 text-xs mb-3">
                            <span class="text-yellow-400 font-bold"><i class="fa-solid fa-star"></i> ${movie.vote_average.toFixed(1)}</span>
                            <span class="text-gray-300 font-semibold">${movie.release_date ? movie.release_date.split('-')[0] : '2026'}</span>
                            <span class="bg-accentRed/80 text-white px-2 py-0.5 rounded text-[10px] font-bold">MOVIE</span>
                        </div>
                        <button onclick="openStream(${movie.id}, '${(movie.title || movie.name).replace(/'/g, "\\'")}')" class="bg-accentRed hover:bg-red-600 text-white font-bold py-2.5 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-red-600/40 text-xs">
                            <i class="fa-solid fa-play"></i> Play Live
                        </button>
                    </div>
                `;
                carouselContainer.appendChild(card);

                // Indicator dot
                const dot = document.createElement('div');
                dot.className = `h-1.5 rounded-full transition-all duration-300 ${idx === currentIndex ? 'w-6 bg-accentRed' : 'w-2 bg-gray-600'}`;
                dotsContainer.appendChild(dot);
            });

            updateCarouselPositions();
        }

        function updateCarouselPositions() {
            const cards = document.querySelectorAll('.carousel-card');
            const dots = dotsContainer.children;
            const total = cards.length;

            cards.forEach((card, idx) => {
                card.className = 'carousel-card hidden-card';
                if (idx === currentIndex) {
                    card.className = 'carousel-card active';
                } else if (idx === (currentIndex - 1 + total) % total) {
                    card.className = 'carousel-card left-1';
                } else if (idx === (currentIndex + 1) % total) {
                    card.className = 'carousel-card right-1';
                }
            });

            Array.from(dots).forEach((dot, idx) => {
                dot.className = `h-1.5 rounded-full transition-all duration-300 ${idx === currentIndex ? 'w-6 bg-accentRed' : 'w-2 bg-gray-600'}`;
            });
        }

        document.getElementById('prevBtn').onclick = () => {
            currentIndex = (currentIndex - 1 + 5) % 5;
            updateCarouselPositions();
        };

        document.getElementById('nextBtn').onclick = () => {
            currentIndex = (currentIndex + 1) % 5;
            updateCarouselPositions();
        };

        function renderGrid(movies) {
            trendingGrid.innerHTML = '';
            movies.forEach(movie => {
                if(!movie.poster_path) return;
                const card = document.createElement('div');
                card.className = 'bg-cardBg rounded-xl overflow-hidden border border-white/5 hover:border-accentRed/50 transition cursor-pointer group';
                card.innerHTML = `
                    <div class="aspect-[2/3] relative overflow-hidden bg-gray-900">
                        <img src="${IMG_URL + movie.poster_path}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-3">
                        <h4 class="text-xs font-bold text-white truncate">${movie.title || movie.name}</h4>
                        <div class="flex items-center justify-between text-[10px] text-gray-400 mt-1">
                            <span><i class="fa-solid fa-star text-yellow-400"></i> ${movie.vote_average.toFixed(1)}</span>
                            <span>${movie.release_date ? movie.release_date.split('-')[0] : 'N/A'}</span>
                        </div>
                    </div>
                `;
                card.onclick = () => openStream(movie.id, movie.title || movie.name);
                trendingGrid.appendChild(card);
            });
        }

        // Search Auto-Trigger
        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            if (query.length > 1) {
                const res = await fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data.results) renderGrid(data.results);
            } else if (query.length === 0) {
                renderGrid(moviesList);
            }
        });

        function openStream(movieId, title) {
            currentMovieId = movieId;
            modalMovieTitle.textContent = title;
            switchServer(1);
            streamModal.classList.remove('hidden');
            streamModal.classList.add('flex');
        }

        function switchServer(serverNum) {
            if (serverNum === 1) {
                videoPlayer.src = `https://vidsrc.to/embed/movie/${currentMovieId}`;
            } else {
                videoPlayer.src = `https://vidsrc.cc/v2/embed/movie/${currentMovieId}`;
            }
        }

        document.getElementById('closeModal').onclick = () => {
            videoPlayer.src = '';
            streamModal.classList.remove('flex');
            streamModal.classList.add('hidden');
        };

        initApp();
    </script>
</body>
</html>
